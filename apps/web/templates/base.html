<!DOCTYPE html>
<html lang="{{ locale }}" dir="{{ direction }}">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/aegis.css"/>
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
<input id="nav-toggle" class="nav-toggle" type="checkbox"/>
<label class="nav-scrim" for="nav-toggle"><span class="sr-only">Close navigation</span></label>
<input id="chat-toggle" class="chat-toggle" type="checkbox"/>
{{ guide_toggle_html|safe }}
<div class="app">
{{ sidebar_html|safe }}
<div class="app-frame">
{{ topbar_html|safe }}
<main class="canvas">
{% block body %}{% endblock %}
</main>
</div>
</div>
{{ chat_html|safe }}
{{ guide_html|safe }}
<div id="aegis-toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>var n=document.getElementById("identity-next");if(n)n.value=location.pathname+location.search;</script>
</body>
</html>
